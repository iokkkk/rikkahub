name: Build RikkaHub APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Write local.properties for the pinned release keystore
        run: |
          {
            echo "storeFile=$GITHUB_WORKSPACE/keystore/rikkahub.key"
            echo "storePassword=rikkahub"
            echo "keyAlias=rikkahub"
            echo "keyPassword=rikkahub"
          } > local.properties

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Show outputs
        run: ls -lh app/build/outputs/apk/release/

      - name: Read version from gradle
        id: ver
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "version=$VN" >> $GITHUB_OUTPUT
          echo "code=$VC" >> $GITHUB_OUTPUT
          echo "resolved versionName=$VN versionCode=$VC"

      - name: Publish Release (arm64 APK only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: RikkaHub v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          body: |
            RikkaHub ${{ steps.ver.outputs.version }} (arm64-v8a)
            - versionName: ${{ steps.ver.outputs.version }}
            - versionCode: ${{ steps.ver.outputs.code }}
            - signing: pinned keystore (installable over previous builds)
          files: |
            app/build/outputs/apk/release/*arm64-v8a*.apk
